[project]
name = "agent-editor"
version = "0.1.0"
description = "Agentic video & film editor: AI footage logging, OTIO timelines, FFmpeg rendering, NLE export, MCP server"
requires-python = ">=3.11"
dependencies = [
  "opentimelineio>=0.17",
  "otio-fcpx-xml-adapter",
  "otio-fcp-adapter",
  "otio-cmx3600-adapter",
  "scenedetect[opencv-headless]>=0.6",
  "faster-whisper>=1.0",
  "librosa>=0.10",
  "soundfile",
  "numpy",
  "pillow",
  "pydantic>=2",
  "typer",
  "rich",
  "mcp>=2.3",
  "anthropic>=0.40",
  "auto-editor",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ae = "agent_editor.cli:app"
agent-editor-mcp = "agent_editor.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_editor"]
